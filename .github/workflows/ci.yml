name: Terraform CI

on:
  pull_request:
    paths:
      - '**.tf'

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0  # 使っているバージョンに合わせる

      - name: Terraform fmt check
        run: terraform fmt -check -diff -recursive